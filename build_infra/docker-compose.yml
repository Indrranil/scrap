services:
  api:
    container_name: digiscrapyard-api-dev
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      MYSQL_HOST: mysql
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    volumes:
      - ../app/images:/app/app/images
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - digiscrapyard-nw

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-digiscrapyard}
      MYSQL_USER: ${MYSQL_USER:-digiscrapyard}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
    restart: always
    ports:
      - "${MYSQL_HOST_PORT:-3308}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - digiscrapyard-nw
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
    name: digiscrapyard_mysql_data_dev

networks:
  digiscrapyard-nw:
    name: digiscrapyard-nw-dev
