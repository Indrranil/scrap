services:
  api:
    container_name: api
    build:
      context: ..
      dockerfile: build_infra/Dockerfile.api
    restart: always
    volumes:
      - ../app/images:/app/images
    environment:
      - API_PORT=${API_PORT}
      - MYSQL_HOST=mysql
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_PORT=${MYSQL_PORT}
    ports:
      - ${API_PORT:-8000}:${API_PORT:-8000}
    networks:
      - polarisai-services-nw
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: [ 'CMD', 'curl', '--silent', '--fail', '-X', 'GET', 'http://localhost:${API_PORT}/' ]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 2
  mysql:
    build: .
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    restart: always
    ports:
      - "${MYSQL_HOST_PORT:-3308}:${MYSQL_PORT:-3306}"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - polarisai-services-nw
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    environment:
      KC_DB: "mysql"
      KC_DB_URL: "jdbc:mysql://mysql:3306/keycloak_db"
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "true"
      KEYCLOAK_SCRIPT_UPLOAD: "true"
      KC_HTTPS_KEY_STORE_PASSWORD: ${KC_HTTPS_KEY_STORE_PASSWORD}
      KC_HTTPS_KEY_STORE_FILE: opt/keycloak/conf/keystore.p12
    restart: always
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ../keycloak/import:/opt/keycloak/data/import
      - ${KEYCLOAK_SSL_CERT}:/opt/keycloak/conf/keystore.p12
    ports:
      - "${KEYCLOAK_HTTP_PORT}:${KEYCLOAK_HTTP_PORT}"
      - "${KEYCLOAK_HTTPS_PORT}:${KEYCLOAK_HTTPS_PORT}"
    networks:
      - polarisai-services-nw
    depends_on:
      mysql:
        condition: service_healthy
    command: 
      - start-dev
      - --import-realm
      - --verbose
volumes:
  mysql_data:
    name: polarisai_mysql_data
    external: true
  keycloak_data:
    name: polarisai_keycloak_data
    external: true
      

networks:
  polarisai-services-nw:
    name: polarisai-services-nw
    external: true