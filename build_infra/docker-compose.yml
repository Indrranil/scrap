services:
  api:
    container_name: digiscrapyard-api
    build:
      context: ..
      dockerfile: build_infra/Dockerfile.api
    restart: always
    volumes:
      - ../app/images:/app/images
    environment:
      - API_PORT=${API_PORT:-8000}
      - MYSQL_HOST=mysql
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRE_HOURS=${JWT_EXPIRE_HOURS:-24}
    ports:
      - ${API_PORT:-8000}:${API_PORT:-8000}
    networks:
      - digiscrapyard-nw
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '--silent', '--fail', '-X', 'GET', 'http://localhost:${API_PORT:-8000}/']
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 2

  mysql:
    build: .
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    restart: always
    ports:
      - "${MYSQL_HOST_PORT:-3308}:${MYSQL_PORT:-3306}"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - digiscrapyard-nw
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
    name: digiscrapyard_mysql_data

networks:
  digiscrapyard-nw:
    name: digiscrapyard-nw
