services:
  digiscrapyard-api:
    build: .
    container_name: digiscrapyard-api
    env_file:
      - .env
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    volumes:
      - ./app/images:/app/app/images
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${API_PORT:-8000}/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
